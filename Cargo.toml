[package]
name = "amdbgen"
version = "0.5.4"
edition = "2021"
description = "Generates a Navigraph-style Airport Mapping Database (DO-272 / AMXM layers) from free sources"
license = "MIT"

[[bin]]
name = "amdbgen"
path = "src/main.rs"

[[bin]]
name = "amdb-bridge"
path = "src/bin/amdb-bridge.rs"

[[bin]]
name = "amdb-bridge-gui"
path = "src/bin/amdb-bridge-gui/main.rs"

[dependencies]
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rcgen = "0.14"
ctrlc = "3"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo = "0.33"
geo-types = { version = "0.7", features = ["serde"] }
ureq = { version = "3", features = ["json"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
flate2 = "1"
pdf-writer = "0.12"
base64 = "0.23"
csv = "1"
quick-xml = "0.42"
rayon = "1"
prost = "0.14"
log = { version = "0.4", features = ["std"] }
console = "0.16"
chrono = "0.4"
# Read-only access to the navigation databases the aircraft already ship.
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["high-dpi", "tray-notification", "message-window", "list-view", "file-dialog", "notice", "animation-timer", "menu", "frame", "image-list", "textbox", "embed-resource"] }
winapi = { version = "0.3.9", features = ["synchapi", "handleapi", "winbase", "winerror", "shellapi", "winuser", "securitybaseapi", "sddl", "minwinbase", "winnt", "errhandlingapi", "shlobj", "knownfolders", "combaseapi", "processthreadsapi"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
debug = false
strip = true
