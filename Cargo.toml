[package]
name = "amdbgen"
version = "1.3.1"
edition = "2021"
description = "Generates a Navigraph-style Airport Mapping Database (DO-272 / AMXM layers) from free sources"
license = "MIT"

[[bin]]
name = "amdbgen"
path = "src/main.rs"

[[bin]]
name = "amdb-bridge"
path = "src/bin/amdb-bridge.rs"

[[bin]]
name = "amdb-bridge-gui"
path = "src/bin/amdb-bridge-gui/main.rs"

# The navigation-data converter on its own, for people who want that and not the rest.
# It is the same code `amdbgen navdata` runs, not a copy, and `amdbgen` keeps the command.
[[bin]]
name = "amdb-navdata"
path = "src/bin/amdb-navdata.rs"

# The same converter with a window round it, for people who do not want a terminal.
[[bin]]
name = "amdb-navdata-gui"
path = "src/bin/amdb-navdata-gui.rs"

[[bin]]
name = "a320-oans"
path = "src/bin/a320-oans.rs"

[dependencies]
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rcgen = "0.14"
ctrlc = "3"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo = "0.33"
geo-types = { version = "0.7", features = ["serde"] }
ureq = { version = "3", features = ["json"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
flate2 = "1"
pdf-writer = "0.12"
base64 = "0.23"
csv = "1"
quick-xml = "0.42"
rayon = "1"
prost = "0.14"
log = { version = "0.4", features = ["std"] }
console = "0.16"
chrono = { version = "0.4", features = ["serde"] }
# Read-only access to the navigation databases the aircraft already ship.
rusqlite = { version = "0.37", features = ["bundled"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
png = "0.17"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["high-dpi", "tray-notification", "message-window", "list-view", "file-dialog", "notice", "animation-timer", "menu", "frame", "image-list", "textbox", "embed-resource", "image-decoder", "combobox"] }
raw-window-handle = "0.6.2"
winapi = { version = "0.3.9", features = ["synchapi", "handleapi", "winbase", "winerror", "shellapi", "winuser", "securitybaseapi", "sddl", "minwinbase", "winnt", "errhandlingapi", "shlobj", "knownfolders", "combaseapi", "processthreadsapi", "wincrypt", "winreg", "libloaderapi", "tlhelp32"] }
wry = "0.57.0"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
debug = false
strip = true
